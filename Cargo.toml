[package]
name = "cosmic-deploy-sidebar"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "A COSMIC sidebar showing server health for the ten minutes after a Render deploy"

[[bin]]
name = "cosmic-deploy-sidebar"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
open = "5.3.2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.8"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# Same revision as cosmic-deploys, so both share a build cache and behave the same.
rev = "aabc8dcda530a6ac70617dd578cea55910af53c8"
features = ["dbus-config", "multi-window", "tokio", "wayland", "winit"]
